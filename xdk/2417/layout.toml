# XDK 2.0.2417 data layout the host reads, emitted as XDK_<name> in image_symbols.h
[layout]
# the device: fetch constants (32 x 6 dwords), float constants (vertex 256 float4 then pixel 256), bools, loops
Device_FetchConstants = 0x480
Device_VsConstants = 0x780
Device_BoolConstants = 0x2780
Device_LoopConstants = 0x27A0
# the register shadow, a bank per 0x80 registers from 0x2000
Device_Reg2000 = 0x2CC0
Device_Reg2080 = 0x2D00
Device_Reg2100 = 0x2D0C
Device_Reg2180 = 0x2D60
Device_Reg2200 = 0x2D74
Device_Reg2280 = 0x2DA4
Device_Reg2300 = 0x2DF8
Device_Reg2380 = 0x2E90
# fences: writeback block pointer ([0] last fence passed), next fence, flags (bit 4 fences written by the CPU)
Device_Writeback = 0x2890
Device_Fence = 0x289C
Device_GpuFlags = 0x28C1
Device_GpuFlagCpuFences = 4
# the kick in MakeSpace writes the next fence
Device_KickFences = 1
Device_VertexDeclaration = 0x2C90
Device_IndexBuffer = 0x30F4
Device_RenderTargets = 0x30F8
Device_DepthStencil = 0x3108
Device_StreamStrides = 0x3190
# SetStreamSource's table, 8 bytes per stream {offset, vertex buffer}; the library builds the fetch constants from it
# only in the flush host draws skip (3529 writes them in SetStreamSource, 821F7630, and has no key)
Device_Streams = 0x310C
# vertex buffer: CPU address and size in bytes, each with the fetch constant bits 0 to 1 (type, endian)
VertexBuffer_Address = 0xC
VertexBuffer_Size = 0x10
Device_PixelShader = 0x3290
# SetClipPlane 8273C130 keeps plane i, clip space, at +i * 16 beside PA_CL_UCP
Device_ClipPlanes = 0x3230
Device_VertexShader = 0x3294
# the command ring, allocated a segment at a time: write pointer, segment end, limit, segment start
Device_RingWrite = 0x0
Device_RingSegmentEnd = 0x4
Device_RingLimit = 0x8
Device_RingSegmentStart = 0x36CC
# predicated tiling (BeginTiling 8273D320, EndTiling 8273D758, SetPredication 8273D1E8) as the library's other code
# reads it: flags byte and its tiling bit, tile count, tile rects (16 bytes each) and the same rects aligned to 32,
# predication select (tile i is 3 << 2i); SetViewport 8273BCA8 sizes to the extent (x then y) while the targets
# equal those saved at BeginTiling (the first target, then colour 0 to 3 and depth)
Device_TilingFlags = 0x28C0
Device_TilingOn = 0x10
Device_TileCount = 0x32C4
Device_TileRects = 0x32C8
Device_TileRectsAligned = 0x33B8
Device_Predication = 0x32A0
Device_TilingTargets = 0x32AC
Device_TilingExtent = 0x34A8
Texture_FetchConstant = 0x10
VertexDeclaration_Count = 0x8
VertexDeclaration_Elements = 0x24
# index buffer: format (bit 31 32 bit indices), CPU address
IndexBuffer_Format = 0x0
IndexBuffer_Address = 0xC
Query_Type = 0x4
# shader containers (0x102A0Exx): the physical block is the microcode, its size in the header
Shader_Magic = 0x102A0E
Shader_Info = 0x14
Shader_CodeSize = 0x8
ShaderInfo_ProgramControl = 0x0
ShaderInfo_ContextMisc = 0x4
# bits 5 to 9 count the pixel inputs, or the vertex exports
ShaderInfo_Interpolators = 0x10
PixelInfo_Inputs = 0x20
VertexInfo_Skip = 0x18
VertexInfo_ElementCount = 0x1C
VertexInfo_Elements = 0x28
# XAudio source voice types past 1 (16 bit PCM): 8 bit PCM (Bink 828715B8), XMA
XAudio_SourcePcm8 = 2
XAudio_SourceXma = 3
