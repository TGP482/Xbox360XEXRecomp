# XDK 2.0.3215 data layout the host reads, emitted as XDK_<name> in image_symbols.h
[layout]
# the device: fetch constants (32 x 6 dwords), float constants (vertex 256 float4 then pixel 256), bools, loops
Device_FetchConstants = 0x400
Device_VsConstants = 0x700
Device_BoolConstants = 0x2700
Device_LoopConstants = 0x2720
# the register shadow, a bank per 0x80 registers from 0x2000
Device_Reg2000 = 0x2800
Device_Reg2080 = 0x2840
Device_Reg2100 = 0x284C
Device_Reg2180 = 0x28A0
Device_Reg2200 = 0x28B4
Device_Reg2280 = 0x28E4
Device_Reg2300 = 0x2938
Device_Reg2380 = 0x29D0
# fences: writeback block pointer ([0] last fence passed), next fence, flags (bit 1 fences written by the CPU)
Device_Writeback = 0x2A10
Device_Fence = 0x2A1C
Device_GpuFlags = 0x2A39
Device_GpuFlagCpuFences = 2
# SetFVF 825D14A0 points it at the device's own declaration; SetStreamSource 825CFF98 writes the fetch constants
Device_VertexDeclaration = 0x2D20
Device_IndexBuffer = 0x2F94
Device_RenderTargets = 0x2F98
Device_DepthStencil = 0x2FA8
Device_StreamStrides = 0x2FF0
Device_PixelShader = 0x3090
Device_VertexShader = 0x3094
# the command ring: write pointer, segment end, limit, base, segment size, segment start
Device_RingWrite = 0x28
Device_RingSegmentEnd = 0x2C
Device_RingLimit = 0x30
Device_RingBase = 0x34C0
Device_RingSegment = 0x34C8
Device_RingSegmentStart = 0x34D8
# vertical blank (interrupt handler 825D3BA0): callback, count, count at the swap wait's end, swap wait, swaps
Device_Vblank = 0x3B28
# predicated tiling (BeginTiling 825D9368, EndTiling 825D9778, SetPredication 825D91E0): flags byte and its tiling
# bit, tile count, tile rects (16 bytes each) and their top left aligned to 32 (8 bytes each); SetViewport 825CFD70
# sizes to the extent (x then y) while the targets equal those saved at BeginTiling (the first target, then colour 0
# to 3 and depth)
Device_TilingFlags = 0x2A38
Device_TilingOn = 0x20
Device_TileCount = 0x30C8
Device_TileRects = 0x30CC
Device_TileRectsAligned = 0x31BC
Device_TileRectsAlignedStride = 8
Device_TilingTargets = 0x30B0
Device_TilingExtent = 0x3274
Texture_FetchConstant = 0x1C
# no literal block: the library has no draw time constant load, the title loads its own (825DAE10)
VertexDeclaration_Count = 0x18
VertexDeclaration_Elements = 0x34
# index buffer: format (bit 31 32 bit indices, endian at 29), CPU address
IndexBuffer_Format = 0x0
IndexBuffer_Address = 0x18
IndexBuffer_Endian = 29
Query_Type = 0x4
# shader containers (0x102A0Exx), as 2417's: the physical block is the microcode, its size in the header
Shader_Magic = 0x102A0E
Shader_Info = 0x14
Shader_CodeSize = 0x8
ShaderInfo_ProgramControl = 0x0
ShaderInfo_ContextMisc = 0x4
# bits 5 to 9 count the pixel inputs, or the vertex exports
ShaderInfo_Interpolators = 0x10
PixelInfo_Inputs = 0x20
VertexInfo_Skip = 0x18
VertexInfo_ElementCount = 0x1C
VertexInfo_Elements = 0x28
# XAudio source voice types past 1 (16 bit PCM): 8 bit PCM (Bink 8278CA48), XMA (XACT 825EA418)
XAudio_SourcePcm8 = 2
XAudio_SourceXma = 4

# voices as guest objects: vtable slots read from the wrappers 82604500 to 82604A88, the source part at +0x4C
XAudio_VoiceSourcePart = 0x4C
XAudioVoiceSlot_AddRef = 0x4
XAudioVoiceSlot_Release = 0x8
# the title calls it inlined (82106120), no wrapper left
XAudioVoiceSlot_SetEffectState = 0x18
XAudioVoiceSlot_SetEffectParam = 0x20
XAudioVoiceSlot_SetVoiceOutput = 0x24
XAudioVoiceSlot_SetVoiceOutputVolume = 0x28
XAudioVoiceSlot_GetVoiceState = 0x30
XAudioVoiceSlot_Stop = 0x3C
XAudioVoiceSlot_SetVolume = 0x5C
XAudioSourceSlot_SubmitPacket = 0x1C
XAudioSourceSlot_GetPacketPosition = 0x3C
XAudioSourceSlot_SetPacketPosition = 0x40
XAudioSourceSlot_SetPacketLoopCount = 0x48
XAudioSourceSlot_SetPitch = 0x60
